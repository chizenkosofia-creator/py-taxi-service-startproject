name: Test

on:
  pull_request:
    branches:
      - "master"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set Up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install django pytest

      - name: Run tests
        run: |
          set -e
          echo "Searching for manage.py..."
          MG=$(find . -name manage.py | head -n1 || true)
          if [ -n "$MG" ]; then
            echo "Found manage.py at: $MG"
            python -m pip install --upgrade pip
            pip install -r requirements.txt --no-cache-dir || pip install django pytest
            python "$MG" test
          else
            echo "manage.py not found — running pytest"
            python -m pip install --upgrade pip
            pip install pytest
            pytest -q
          fi